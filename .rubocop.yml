inherit_gem:
  rubocop-lts: rubocop-lts.yml

require:
  - 'rubocop-rspec'
  - 'rubocop-thread_safety'

inherit_from:
  - .rubocop_todo.yml
  - .rubocop_rspec.yml
plugins:
  - rubocop-rspec
  - rubocop-on-rbs
  - rubocop-packaging
# This tells RuboCop to add the exclusions in this file
# to the default exclusions (and those from other inherited files),
# rather than overwriting them.
inherit_mode:
  merge:
    - Exclude

AllCops:
  DisplayCopNames: true # Display the name of the failing cops
  Exclude:
    - 'gemfiles/vendor/**/*'
    - 'vendor/**/*'
    - '**/.irbrc'

#Metrics/BlockLength:
#  IgnoredMethods:
#    - context
#    - describe
#    - it
#    - shared_context
#    - shared_examples
#    - shared_examples_for
#    - namespace
#    - draw

#Gemspec/RequiredRubyVersion:
#  Enabled: false

Style/PercentLiteralDelimiters:
  PreferredDelimiters:
    default: '[]'
    '%i':    '()'
    '%w':    '[]'

Metrics/BlockNesting:
  Max: 2

Layout/LineLength:
  Enabled: false

Metrics/ParameterLists:
  Max: 4

Layout/AccessModifierIndentation:
  EnforcedStyle: outdent

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Lint/UnusedBlockArgument:
  Exclude:
    - 'spec/**/*.rb'
    - 'gemfiles/vendor/**/*'
    - 'vendor/**/*'
    - '**/.irbrc'

Style/ClassVars:
  Enabled: false

Style/CollectionMethods:
  PreferredMethods:
    map:      'collect'
    reduce:   'inject'
    find:     'detect'
    find_all: 'select'

Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

#Style/EmptyMethod:
#  EnforcedStyle: expanded

Style/Encoding:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

#Style/TrailingCommaInArrayLiteral:
#  EnforcedStyleForMultiline: comma
#
#Style/TrailingCommaInHashLiteral:
#  EnforcedStyleForMultiline: comma

Style/HashSyntax:
  EnforcedStyle: hash_rockets

Style/Lambda:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/EachWithObject:
  Enabled: false

# Once we drop Rubies that lack support for __dir__ we can turn this on.
#Style/ExpandPathArguments:
#  Enabled: false

# On Ruby 1.9 array.to_h isn't available, needs to be Hash[array]
#Style/HashConversion:
#  Enabled: false

# Turn back on once old Rubies are dropped
Style/IfUnlessModifier:
  Enabled: false

#Style/SafeNavigation:
#  Enabled: false
RBS:
  Enabled: true
Layout/IndentationConsistency:
  Exclude: ['*.md']
# Appraisal uses this filename for the moving HEAD dependency fixture.
Naming/FileName:
  Exclude:
    - '**/vHEAD.gemfile'
